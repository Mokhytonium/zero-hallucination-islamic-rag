[project]
name = "islamic-rag"
version = "0.3.2"
description = "Zero-Hallucination Islamic RAG — Quran vertical slice"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "numpy>=1.26",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]
web = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
islamic-rag = "islamic_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/islamic_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["SIM905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]